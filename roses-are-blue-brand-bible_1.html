<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roses Are Blue Bible</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200;0,300;0,400;0,600;0,700;1,200;1,300;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --green:   #0f1f1c;
    --green-mid: #1a3530;
    --green-light: #244440;
    --green-border: #2a4f4a;
    --cream:   #fbf5ed;
    --cream-dim: #e8ddd0;
    --cream-muted: #c4b8a8;
    --cream-faint: #a09080;
    --accent:  #fbf5ed;
    --accent-light: rgba(251,245,237,0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--green);
    color: var(--cream);
    font-family: 'Source Sans 3', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* ── HEADER ── */
  header {
    padding: 56px 52px 40px;
    border-bottom: 1px solid var(--green-border);
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 24px;
    background: linear-gradient(160deg, #0a1714 0%, var(--green) 100%);
    position: relative;
    overflow: hidden;
  }

  header::before {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 320px; height: 320px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(251,245,237,0.04) 0%, transparent 70%);
    pointer-events: none;
  }

  .logo {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 8px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }

  h1 {
    font-size: clamp(38px, 5vw, 68px);
    font-weight: 200;
    letter-spacing: -0.5px;
    color: var(--cream);
    line-height: 1;
  }

  h1 em {
    font-style: italic;
    font-weight: 300;
    color: var(--accent);
  }

  .subtitle {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--cream-faint);
    margin-top: 12px;
  }

  .stats { text-align: right; }

  .stat-num {
    font-size: 64px;
    font-weight: 200;
    color: var(--accent);
    line-height: 1;
    letter-spacing: -2px;
  }

  .stat-label {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--cream-faint);
    margin-top: 6px;
  }

  /* ── CONTROLS ── */
  .controls {
    padding: 18px 52px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    align-items: center;
    border-bottom: 1px solid var(--green-border);
    background: var(--green);
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--green-border);
    color: var(--cream-faint);
    padding: 7px 16px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 1px;
  }

  .filter-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .filter-btn.active {
    border-color: var(--accent);
    color: var(--green);
    background: var(--accent);
    font-weight: 700;
  }

  .search-wrap {
    margin-left: auto;
    position: relative;
  }

  .search-wrap input {
    background: var(--green-mid);
    border: 1px solid var(--green-border);
    color: var(--cream);
    padding: 8px 16px 8px 36px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 10px;
    font-weight: 300;
    letter-spacing: 0.5px;
    width: 260px;
    outline: none;
    transition: border-color 0.2s;
    border-radius: 1px;
  }

  .search-wrap input::placeholder { color: var(--cream-faint); }
  .search-wrap input:focus { border-color: var(--accent); }

  .search-icon {
    position: absolute;
    left: 12px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--cream-faint);
    font-size: 15px;
    pointer-events: none;
  }

  /* ── RESULTS BAR ── */
  .results-bar {
    padding: 10px 52px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--cream-faint);
    border-bottom: 1px solid var(--green-mid);
    background: var(--green);
  }

  /* ── GRID ── */
  .grid {
    padding: 36px 52px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 2px;
  }

  .category-block {
    background: var(--green-mid);
    border: 1px solid var(--green-border);
    padding: 30px;
    transition: border-color 0.25s, background 0.25s;
  }

  .category-block:hover {
    border-color: var(--accent);
    background: var(--green-light);
  }

  .cat-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--green-border);
  }

  .cat-title {
    font-size: 20px;
    font-weight: 300;
    color: var(--cream);
    letter-spacing: 0.2px;
    line-height: 1.2;
  }

  .cat-icon { font-size: 20px; opacity: 0.4; flex-shrink: 0; margin-left: 12px; margin-top: 2px; }

  .cat-meta {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }

  .cat-tag {
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    padding: 3px 9px;
    border: 1px solid var(--green-border);
    color: var(--cream-faint);
    border-radius: 1px;
  }

  .cat-count {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--accent);
    text-transform: uppercase;
  }

  .brand-list {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .brand {
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.3px;
    color: var(--cream-dim);
    padding: 5px 10px;
    border: 1px solid var(--green-border);
    background: var(--green);
    transition: all 0.15s;
    cursor: default;
    white-space: nowrap;
    border-radius: 1px;
  }

  .brand:hover {
    color: var(--green);
    border-color: var(--accent);
    background: var(--accent);
  }

  .no-results {
    grid-column: 1/-1;
    padding: 100px;
    text-align: center;
    color: var(--green-border);
    font-size: 28px;
    font-weight: 200;
    font-style: italic;
  }

  /* ── FOOTER ── */
  footer {
    padding: 28px 52px;
    border-top: 1px solid var(--green-border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    background: #0a1714;
  }

  .footer-logo {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--green-border);
  }

  .footer-note {
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--green-border);
  }

  /* ── CRM DRAWER ── */
  .drawer-overlay {
    position: fixed;
    inset: 0;
    background: rgba(8,20,18,0.7);
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    backdrop-filter: blur(3px);
  }
  .drawer-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .drawer {
    position: fixed;
    top: 0; right: 0;
    width: min(560px, 100vw);
    height: 100vh;
    background: #0a1714;
    border-left: 1px solid var(--green-border);
    z-index: 600;
    transform: translateX(100%);
    transition: transform 0.3s cubic-bezier(0.4,0,0.2,1);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .drawer.open { transform: translateX(0); }

  .drawer-header {
    padding: 28px 28px 20px;
    border-bottom: 1px solid var(--green-border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
  }
  .drawer-brand-name {
    font-size: 22px;
    font-weight: 300;
    color: var(--cream);
    line-height: 1.2;
  }
  .drawer-category {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cream-faint);
    margin-top: 5px;
  }
  .drawer-close {
    background: none;
    border: 1px solid var(--green-border);
    color: var(--cream-faint);
    width: 32px; height: 32px;
    font-size: 16px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    border-radius: 1px;
    transition: all 0.15s;
  }
  .drawer-close:hover { border-color: var(--cream); color: var(--cream); }

  .drawer-body {
    flex: 1;
    overflow-y: auto;
    padding: 24px 28px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .drawer-body::-webkit-scrollbar { width: 4px; }
  .drawer-body::-webkit-scrollbar-track { background: transparent; }
  .drawer-body::-webkit-scrollbar-thumb { background: var(--green-border); border-radius: 2px; }

  /* Status row */
  .crm-section-label {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cream-faint);
    margin-bottom: 10px;
  }

  .status-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .status-btn {
    font-family: 'Source Sans 3', sans-serif;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 6px 12px;
    border-radius: 1px;
    cursor: pointer;
    transition: all 0.15s;
    border: 1px solid var(--green-border);
    background: transparent;
    color: var(--cream-faint);
  }
  .status-btn.active-status { color: var(--green); }
  .status-btn[data-s="Cold"].active-status          { background:#4a7fa5; border-color:#4a7fa5; }
  .status-btn[data-s="Warm"].active-status          { background:#c9914a; border-color:#c9914a; }
  .status-btn[data-s="Meeting Booked"].active-status{ background:#7a9e7e; border-color:#7a9e7e; }
  .status-btn[data-s="Proposal Sent"].active-status { background:#9e7a9e; border-color:#9e7a9e; }
  .status-btn[data-s="Won"].active-status            { background:#5a9e6e; border-color:#5a9e6e; }
  .status-btn[data-s="Not Interested"].active-status{ background:#8a4a4a; border-color:#8a4a4a; }

  /* Status dot on brand pill */
  .brand { position: relative; cursor: pointer; }
  .brand .status-dot {
    position: absolute;
    top: -3px; right: -3px;
    width: 7px; height: 7px;
    border-radius: 50%;
    border: 1px solid var(--green-mid);
  }
  .dot-Cold           { background: #4a7fa5; }
  .dot-Warm           { background: #c9914a; }
  .dot-Meeting\ Booked{ background: #7a9e7e; }
  .dot-Proposal\ Sent { background: #9e7a9e; }
  .dot-Won            { background: #5a9e6e; }
  .dot-Not\ Interested{ background: #8a4a4a; }

  /* Notes */
  .crm-textarea {
    width: 100%;
    background: var(--green-mid);
    border: 1px solid var(--green-border);
    color: var(--cream);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 12px;
    font-weight: 300;
    line-height: 1.6;
    padding: 12px 14px;
    border-radius: 1px;
    resize: vertical;
    min-height: 90px;
    outline: none;
    transition: border-color 0.2s;
  }
  .crm-textarea:focus { border-color: var(--cream-faint); }
  .crm-textarea::placeholder { color: var(--cream-faint); }

  /* Next action */
  .next-action-row {
    display: flex;
    gap: 10px;
    align-items: center;
  }
  .crm-input {
    flex: 1;
    background: var(--green-mid);
    border: 1px solid var(--green-border);
    color: var(--cream);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 12px;
    font-weight: 300;
    padding: 9px 12px;
    border-radius: 1px;
    outline: none;
    transition: border-color 0.2s;
  }
  .crm-input:focus { border-color: var(--cream-faint); }
  .crm-input::placeholder { color: var(--cream-faint); }
  .crm-date {
    background: var(--green-mid);
    border: 1px solid var(--green-border);
    color: var(--cream-faint);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 11px;
    padding: 9px 10px;
    border-radius: 1px;
    outline: none;
    width: 148px;
    cursor: pointer;
  }
  .crm-date:focus { border-color: var(--cream-faint); color: var(--cream); }

  /* Contacts */
  .contacts-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .contact-card {
    background: var(--green-mid);
    border: 1px solid var(--green-border);
    border-radius: 1px;
    padding: 14px 16px;
    position: relative;
  }
  .contact-card-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .contact-card-row.full { grid-template-columns: 1fr; }
  .contact-delete {
    position: absolute;
    top: 10px; right: 10px;
    background: none;
    border: none;
    color: var(--cream-faint);
    cursor: pointer;
    font-size: 14px;
    line-height: 1;
    padding: 2px 5px;
    transition: color 0.15s;
    border-radius: 1px;
  }
  .contact-delete:hover { color: #c06060; }

  .add-contact-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: transparent;
    border: 1px dashed var(--green-border);
    color: var(--cream-faint);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 10px 16px;
    cursor: pointer;
    border-radius: 1px;
    width: 100%;
    transition: all 0.15s;
    margin-top: 4px;
  }
  .add-contact-btn:hover { border-color: var(--cream-faint); color: var(--cream); }

  /* Save button */
  .save-btn {
    background: var(--cream);
    border: none;
    color: var(--green);
    font-family: 'Source Sans 3', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 13px 28px;
    cursor: pointer;
    border-radius: 1px;
    transition: opacity 0.15s;
    width: 100%;
  }
  .save-btn:hover { opacity: 0.85; }
  .save-flash {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: #5a9e6e;
    text-align: center;
    height: 16px;
    transition: opacity 0.3s;
  }

  /* Last contacted */
  .last-contacted {
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 1px;
    color: var(--cream-faint);
    margin-top: 4px;
  }

  /* CRM summary bar */
  .crm-stats-bar {
    padding: 8px 52px;
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--cream-faint);
    background: var(--green-mid);
    border-bottom: 1px solid var(--green-border);
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
  }
  .crm-stat { display: flex; align-items: center; gap: 6px; }
  .crm-stat-dot { width: 8px; height: 8px; border-radius: 50%; }

  /* ── TABS ── */
  .tab-btn {
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--cream-faint);
    padding: 8px 4px;
    font-family: 'Source Sans 3', sans-serif;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    margin-right: 8px;
  }
  .tab-btn:hover { color: var(--cream); }
  .tab-btn.active { color: var(--cream); border-bottom-color: var(--cream); }
  .tab-divider {
    width: 1px;
    height: 20px;
    background: var(--green-border);
    margin: 0 8px;
    align-self: center;
  }

  /* ── SHOW CARDS ── */
  .shows-timeline { display: flex; flex-direction: column; gap: 2px; }
  .month-group { margin-bottom: 28px; }
  .month-label {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--cream-faint);
    padding: 12px 0 10px;
    border-bottom: 1px solid var(--green-border);
    margin-bottom: 10px;
  }
  .show-card {
    background: var(--green-mid);
    border: 1px solid var(--green-border);
    padding: 22px 26px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    display: grid;
    grid-template-columns: 140px 1fr auto;
    gap: 20px;
    align-items: start;
    margin-bottom: 2px;
  }
  .show-card:hover { border-color: var(--cream-faint); background: var(--green-light); }
  .show-card.expanded { border-color: var(--cream); background: var(--green-light); }
  .show-date-col { flex-shrink: 0; }
  .show-dates {
    font-size: 18px;
    font-weight: 200;
    color: var(--cream);
    line-height: 1.1;
  }
  .show-year {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    color: var(--cream-faint);
    margin-top: 4px;
    text-transform: uppercase;
  }
  .show-main { min-width: 0; }
  .show-name {
    font-size: 17px;
    font-weight: 400;
    color: var(--cream);
    line-height: 1.2;
    margin-bottom: 4px;
  }
  .show-location {
    font-size: 10px;
    font-weight: 400;
    color: var(--cream-faint);
    margin-bottom: 8px;
  }
  .show-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .show-tag {
    font-size: 7px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 3px 8px;
    border: 1px solid var(--green-border);
    color: var(--cream-faint);
    border-radius: 1px;
  }
  .show-tag.sector-Fashion { border-color: #7a6a9e; color: #7a6a9e; }
  .show-tag.sector-Watches { border-color: #9e8a4a; color: #9e8a4a; }
  .show-tag.sector-Art { border-color: #5a8a7e; color: #5a8a7e; }
  .show-tag.sector-Design { border-color: #4a7a8a; color: #4a7a8a; }
  .show-tag.sector-Creative { border-color: #8a5a7a; color: #8a5a7a; }
  .show-tag.sector-Gulf { border-color: #8a7a4a; color: #8a7a4a; }
  .show-tag.sector-Travel { border-color: #4a8a5a; color: #4a8a5a; }
  .show-tag.sector-Sport { border-color: #4a6a9e; color: #4a6a9e; }
  .show-chevron {
    font-size: 12px;
    color: var(--cream-faint);
    margin-top: 4px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .show-card.expanded .show-chevron { transform: rotate(180deg); }
  .show-brands-panel {
    display: none;
    grid-column: 1 / -1;
    padding-top: 16px;
    border-top: 1px solid var(--green-border);
    margin-top: 16px;
  }
  .show-card.expanded .show-brands-panel { display: block; }
  .show-brands-label {
    font-size: 8px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cream-faint);
    margin-bottom: 12px;
  }
  .show-brands-list { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 14px; }
  .show-brand-pill {
    font-size: 9px;
    font-weight: 400;
    color: var(--cream-dim);
    padding: 4px 9px;
    border: 1px solid var(--green-border);
    background: var(--green);
    border-radius: 1px;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  .show-brand-pill:hover { color: var(--green); background: var(--cream); border-color: var(--cream); }
  .show-desc {
    font-size: 11px;
    font-weight: 300;
    color: var(--cream-muted);
    line-height: 1.6;
    margin-bottom: 12px;
    max-width: 700px;
  }
  .show-website {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--cream-faint);
    text-decoration: none;
    border-bottom: 1px solid var(--green-border);
    padding-bottom: 1px;
    transition: color 0.15s, border-color 0.15s;
  }
  .show-website:hover { color: var(--cream); border-color: var(--cream-faint); }

// ── CRM DATA ────────────────────────────────────────────────────
function crmKey(brand) { return 'crm_' + brand.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,''); }

function getCRM(brand) {
  try { return JSON.parse(localStorage.getItem(crmKey(brand))) || {}; } catch(e) { return {}; }
}
function saveCRM(brand, data) {
  try { localStorage.setItem(crmKey(brand), JSON.stringify(data)); } catch(e) {}
}

const STATUS_COLORS = {
  'Cold':'#4a7fa5','Warm':'#c9914a','Meeting Booked':'#7a9e7e',
  'Proposal Sent':'#9e7a9e','Won':'#5a9e6e','Not Interested':'#8a4a4a'
};

function updateCRMStatsBar() {
  const counts = {};
  Object.keys(STATUS_COLORS).forEach(s => counts[s] = 0);
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith('crm_')) {
        const d = JSON.parse(localStorage.getItem(k));
        if (d && d.status && counts[d.status] !== undefined) counts[d.status]++;
      }
    }
  } catch(e) {}
  const hasAny = Object.values(counts).some(v => v > 0);
  document.getElementById('crmStatsBar').style.display = hasAny ? 'flex' : 'none';
  Object.keys(counts).forEach(s => {
    const el = document.getElementById('stat-' + s);
    if (el) el.textContent = counts[s] + ' ' + s;
  });
}

// ── DRAWER ──────────────────────────────────────────────────────
let currentBrand = '';
let currentCategory = '';

function openDrawer(brand, category) {
  currentBrand = brand;
  currentCategory = category;
  const data = getCRM(brand);

  document.getElementById('drawerBrandName').textContent = brand;
  document.getElementById('drawerCategory').textContent = category;

  const lc = data.lastContacted ? 'Last contact: ' + data.lastContacted : 'No contact logged yet';
  document.getElementById('drawerLastContacted').textContent = lc;

  // Status
  document.querySelectorAll('.status-btn').forEach(btn => {
    btn.classList.remove('active-status');
    if (btn.dataset.s === data.status) btn.classList.add('active-status');
  });

  document.getElementById('drawerNotes').value = data.notes || '';
  document.getElementById('drawerNextAction').value = data.nextAction || '';
  document.getElementById('drawerNextDate').value = data.nextDate || '';

  renderContacts(data.contacts || []);

  document.getElementById('saveFlash').textContent = '';
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.querySelectorAll('.status-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.status-btn').forEach(b => b.classList.remove('active-status'));
    this.classList.add('active-status');
  });
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

// ── CONTACTS ────────────────────────────────────────────────────
function renderContacts(contacts) {
  const list = document.getElementById('contactsList');
  list.innerHTML = '';
  contacts.forEach((c, i) => {
    const card = document.createElement('div');
    card.className = 'contact-card';
    card.innerHTML = `
      <button class="contact-delete" onclick="deleteContact(${i})" title="Remove">✕</button>
      <div class="contact-card-row">
        <input class="crm-input" placeholder="Full name" value="${c.name||''}" data-ci="${i}" data-field="name">
        <input class="crm-input" placeholder="Job title" value="${c.title||''}" data-ci="${i}" data-field="title">
      </div>
      <div class="contact-card-row">
        <input class="crm-input" placeholder="Email" value="${c.email||''}" data-ci="${i}" data-field="email">
        <input class="crm-input" placeholder="Phone" value="${c.phone||''}" data-ci="${i}" data-field="phone">
      </div>
      <div class="contact-card-row full">
        <input class="crm-input" placeholder="LinkedIn URL" value="${c.linkedin||''}" data-ci="${i}" data-field="linkedin">
      </div>
      <div class="contact-card-row full">
        <input class="crm-input" placeholder="Notes on this person" value="${c.personNotes||''}" data-ci="${i}" data-field="personNotes">
      </div>
    `;
    list.appendChild(card);
  });
}

function addContactCard() {
  const data = getCRM(currentBrand);
  const contacts = data.contacts || [];
  contacts.push({name:'',title:'',email:'',phone:'',linkedin:'',personNotes:''});
  data.contacts = contacts;
  saveCRM(currentBrand, data);
  renderContacts(contacts);
  // scroll to bottom of drawer body
  const body = document.querySelector('.drawer-body');
  setTimeout(() => body.scrollTop = body.scrollHeight, 50);
}

function deleteContact(i) {
  const data = getCRM(currentBrand);
  const contacts = data.contacts || [];
  contacts.splice(i, 1);
  data.contacts = contacts;
  saveCRM(currentBrand, data);
  renderContacts(contacts);
}

// ── SAVE ────────────────────────────────────────────────────────
function saveBrandData() {
  const data = getCRM(currentBrand) || {};

  const activeBtn = document.querySelector('.status-btn.active-status');
  data.status = activeBtn ? activeBtn.dataset.s : (data.status || '');
  data.notes = document.getElementById('drawerNotes').value;
  data.nextAction = document.getElementById('drawerNextAction').value;
  data.nextDate = document.getElementById('drawerNextDate').value;
  data.lastContacted = new Date().toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric'});

  // collect contacts from DOM
  const inputs = document.querySelectorAll('#contactsList [data-ci]');
  const contacts = data.contacts || [];
  inputs.forEach(inp => {
    const i = parseInt(inp.dataset.ci);
    if (!contacts[i]) contacts[i] = {};
    contacts[i][inp.dataset.field] = inp.value;
  });
  data.contacts = contacts;

  saveCRM(currentBrand, data);

  // update dot on brand pill
  updateBrandPill(currentBrand, data.status);
  updateCRMStatsBar();

  // update last contacted label
  document.getElementById('drawerLastContacted').textContent = 'Last contact: ' + data.lastContacted;

  const flash = document.getElementById('saveFlash');
  flash.textContent = '✓ Saved';
  setTimeout(() => flash.textContent = '', 2000);
}

function updateBrandPill(brand, status) {
  document.querySelectorAll('.brand').forEach(el => {
    if (el.dataset.brand === brand) {
      let dot = el.querySelector('.status-dot');
      if (status) {
        if (!dot) { dot = document.createElement('span'); dot.className = 'status-dot'; el.appendChild(dot); }
        dot.className = 'status-dot dot-' + status;
        dot.title = status;
      } else {
        if (dot) dot.remove();
      }
    }
  });
}

// ── RENDER GRID ─────────────────────────────────────────────────
function renderGrid() {
  const query = searchInput.value.trim().toLowerCase();
  grid.innerHTML = '';
  let visibleCategories = 0;
  let visibleBrands = 0;

  categories.forEach(cat => {
    const tagMatch = activeFilter === 'all' || cat.tags.includes(activeFilter);
    if (!tagMatch) return;

    const filteredBrands = query
      ? cat.brands.filter(b => b.toLowerCase().includes(query))
      : cat.brands;

    if (filteredBrands.length === 0) return;

    visibleCategories++;
    visibleBrands += filteredBrands.length;

    const block = document.createElement('div');
    block.className = 'category-block';

    const brandHTML = filteredBrands.map(b => {
      const d = getCRM(b);
      const dot = d.status ? `<span class="status-dot dot-${d.status}" title="${d.status}"></span>` : '';
      return `<span class="brand" data-brand="${b}" data-cat="${cat.title}" onclick="openDrawer('${b.replace(/'/g,"\\'")}','${cat.title.replace(/'/g,"\\'")}')">
        ${b}${dot}
      </span>`;
    }).join('');

    block.innerHTML = `
      <div class="cat-header">
        <div class="cat-title">${cat.title}</div>
        <div class="cat-icon">${cat.icon}</div>
      </div>
      <div class="cat-meta">
        <div class="cat-tag">${cat.tags.join(' · ')}</div>
        <div class="cat-count">${filteredBrands.length} brands</div>
      </div>
      <div class="brand-list">${brandHTML}</div>
    `;
    grid.appendChild(block);
  });

  if (visibleCategories === 0) {
    grid.innerHTML = '<div class="no-results">No brands found</div>';
    resultsBar.textContent = '0 results';
  } else {
    resultsBar.textContent = `Showing ${visibleBrands.toLocaleString()} brands across ${visibleCategories} categories — click any brand to log contact`;
  }
}

document.querySelectorAll('.filter-btn[data-filter]').forEach(btn => {

    renderGrid();

});

// ── SHOWS RENDER ────────────────────────────────────────────────
let activeShowFilter = 'all';

function renderShows() {
  const query = searchInput.value.trim().toLowerCase();
  const view = document.getElementById('showsView');

  let filtered = shows.filter(s => {
    const matchFilter = activeShowFilter === 'all' || s.sector === activeShowFilter;
    const matchQuery = !query || s.name.toLowerCase().includes(query) ||
      s.location.toLowerCase().includes(query) ||
      s.brands.some(b => b.toLowerCase().includes(query)) ||
      (s.pastSponsors && s.pastSponsors.some(b => b.toLowerCase().includes(query))) ||
      (s.registered && s.registered.some(b => b.toLowerCase().includes(query)));
    return matchFilter && matchQuery;
  });

  if (filtered.length === 0) {
    view.innerHTML = '<div class="no-results">No shows found</div>';
    document.getElementById('resultsBar').textContent = '0 shows';
    return;
  }

  document.getElementById('resultsBar').textContent =
    `${filtered.length} show${filtered.length !== 1 ? 's' : ''} — click any show to see brands, past sponsors & registered`;

  // Group by month
  const months = {};
  filtered.forEach(s => {
    if (!months[s.month]) months[s.month] = [];
    months[s.month].push(s);
  });

  view.innerHTML = '';

  Object.keys(months).forEach(month => {
    const group = document.createElement('div');
    group.className = 'month-group';
    group.innerHTML = `<div class="month-label">${month}</div>`;

    months[month].forEach(show => {
      const pastSponsors = show.pastSponsors || [];
      const registered = show.registered || [];
      // Brands = all brands minus past sponsors and registered (they appear in their own sections)
      const allBrands = show.brands || [];
      const approachBrands = query
        ? allBrands.filter(b => b.toLowerCase().includes(query))
        : allBrands;

      const card = document.createElement('div');
      card.className = 'show-card';

      // Build brand status indicator dots
      const hasPast = pastSponsors.length > 0;
      const hasReg = registered.length > 0;

      let statusDots = '';
      if (hasReg) statusDots += `<span class="show-status-dot registered-dot" title="Has registered brands">●</span>`;
      if (hasPast) statusDots += `<span class="show-status-dot past-dot" title="Has past sponsors">◉</span>`;

      card.innerHTML = `
        <div class="show-date-col">
          <div class="show-dates">${show.dates}</div>
          <div class="show-year">${show.year}</div>
        </div>
        <div class="show-main">
          <div class="show-name">${show.name} ${statusDots}</div>
          <div class="show-location">📍 ${show.location}</div>
          <div class="show-tags">
            <span class="show-tag sector-${show.sector}">${show.sector}</span>
            ${hasPast ? '<span class="show-tag past-tag">Past Sponsors Known</span>' : ''}
            ${hasReg ? '<span class="show-tag reg-tag">Brands Registered</span>' : ''}
          </div>
          <div class="show-brands-panel">
            <div class="show-desc">${show.desc}</div>

            ${registered.length > 0 ? `
            <div class="show-subsection">
              <div class="show-subsection-label registered-label">✅ Already Registered / Confirmed</div>
              <div class="show-subsection-note">These brands are confirmed attending — approach for activation partnership</div>
              <div class="show-brands-list">
                ${registered.map(b => `<span class="show-brand-pill registered-pill" onclick="switchToBrandAndOpen('${b.replace(/'/g,"\\'")}','${show.name.replace(/'/g,"\\'")}');">${b}</span>`).join('')}
              </div>
            </div>` : ''}

            ${pastSponsors.length > 0 ? `
            <div class="show-subsection">
              <div class="show-subsection-label past-label">🔄 Past Sponsors — Likely to Return</div>
              <div class="show-subsection-note">These brands have sponsored in previous years — warm leads for outreach</div>
              <div class="show-brands-list">
                ${pastSponsors.map(b => `<span class="show-brand-pill past-pill" onclick="switchToBrandAndOpen('${b.replace(/'/g,"\\'")}','${show.name.replace(/'/g,"\\'")}');">${b}</span>`).join('')}
              </div>
            </div>` : ''}

            <div class="show-subsection">
              <div class="show-subsection-label approach-label">🎯 All Brands to Approach</div>
              <div class="show-subsection-note">All brands associated with this event — click any to open CRM and log contact</div>
              <div class="show-brands-list">
                ${approachBrands.map(b =>
                  `<span class="show-brand-pill" onclick="switchToBrandAndOpen('${b.replace(/'/g,"\\'")}','${show.name.replace(/'/g,"\\'")}');">${b}</span>`
                ).join('')}
              </div>
            </div>

            <a class="show-website" href="https://www.${show.website}" target="_blank">↗ ${show.website}</a>
          </div>
        </div>
        <div class="show-chevron">▼</div>
      `;

      card.addEventListener('click', (e) => {
        if (e.target.classList.contains('show-brand-pill') || e.target.classList.contains('show-website')) return;
        card.classList.toggle('expanded');
      });

      group.appendChild(card);
    });
    view.appendChild(group);
  });
}

function switchToBrandAndOpen(brand, showName) {
  // Switch to brands tab, search for the brand, open its CRM drawer
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-tab="brands"]').classList.add('active');
  currentTab = 'brands';
  document.getElementById('grid').style.display = '';
  document.getElementById('showsView').style.display = 'none';
  document.getElementById('brandFilters').style.display = 'flex';
  document.getElementById('showFilters').style.display = 'none';
  document.getElementById('crmStatsBar').style.display = '';
  searchInput.placeholder = 'Search brands...';
  searchInput.value = brand;
  activeFilter = 'all';
  document.querySelectorAll('#brandFilters .filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('#brandFilters [data-filter="all"]').classList.add('active');
  renderGrid();
  updateCRMStatsBar();
  // Find the category this brand belongs to
  let cat = '';
  categories.forEach(c => { if (c.brands.includes(brand)) cat = c.title; });
  setTimeout(() => openDrawer(brand, cat || showName), 200);
}

document.querySelectorAll('[data-show-filter]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('[data-show-filter]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeShowFilter = btn.dataset.showFilter;
    renderShows();
  });
});

updateCRMStatsBar();
renderGrid();
</script>
