<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roses Are Blue — Brand Bible</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200;0,300;0,400;0,600;0,700;1,300&display=swap" rel="stylesheet">
<style>
:root{--g:#0f1f1c;--gm:#1a3530;--gl:#244440;--gb:#2a4f4a;--c:#fbf5ed;--cd:#e8ddd0;--cm:#c4b8a8;--cf:#a09080;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--g);color:var(--c);font-family:"Source Sans 3",sans-serif;font-weight:300;min-height:100vh;}

/* HEADER */
header{padding:44px 48px 32px;border-bottom:1px solid var(--gb);display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:20px;background:linear-gradient(160deg,#0a1714 0%,var(--g) 100%);}
.lw{display:flex;align-items:center;gap:18px;margin-bottom:10px;}
.li{width:84px;height:84px;object-fit:contain;}
.wm{font-size:10px;font-weight:700;letter-spacing:8px;text-transform:uppercase;color:var(--c);}
.ws{font-size:18px;font-weight:200;letter-spacing:6px;text-transform:uppercase;color:var(--c);margin-top:5px;}
.sub{font-size:9px;letter-spacing:5px;text-transform:uppercase;color:var(--cf);margin-top:8px;}
.sn{font-size:52px;font-weight:200;color:var(--c);line-height:1;letter-spacing:-2px;text-align:right;}
.sl{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--cf);margin-top:4px;text-align:right;}

/* NAV */
nav{padding:14px 48px;display:flex;gap:5px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--gb);background:var(--g);position:sticky;top:0;z-index:200;}
.tb{background:transparent;border:none;border-bottom:2px solid transparent;color:var(--cf);padding:5px 4px;font-family:"Source Sans 3",sans-serif;font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;cursor:pointer;margin-right:6px;transition:all .2s;}
.tb:hover,.tb.on{color:var(--c);border-bottom-color:var(--c);}
.nd{width:1px;height:16px;background:var(--gb);margin:0 5px;align-self:center;}
.fb{background:transparent;border:1px solid var(--gb);color:var(--cf);padding:5px 12px;font-family:"Source Sans 3",sans-serif;font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:1px;transition:all .2s;}
.fb:hover{border-color:var(--c);color:var(--c);}
.fb.on{border-color:var(--c);color:var(--g);background:var(--c);font-weight:700;}
.sw{margin-left:auto;position:relative;}
.sw input{background:var(--gm);border:1px solid var(--gb);color:var(--c);padding:6px 12px 6px 32px;font-family:"Source Sans 3",sans-serif;font-size:10px;width:220px;outline:none;border-radius:1px;transition:border-color .2s;}
.sw input::placeholder{color:var(--cf);}
.sw input:focus{border-color:var(--cf);}
.si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--cf);font-size:14px;pointer-events:none;}

/* INFO BAR */
.ib{padding:8px 48px;font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--cf);border-bottom:1px solid var(--gm);background:var(--g);}

/* CRM STATS */
.cs{padding:7px 48px;display:none;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--gb);background:var(--gm);}
.cst{display:flex;align-items:center;gap:5px;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--cf);}
.cd2{width:7px;height:7px;border-radius:50%;}

/* BRAND GRID */
#bv{padding:28px 48px;display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:2px;}
.cb{background:var(--gm);border:1px solid var(--gb);padding:22px;transition:border-color .2s;}
.cb:hover{border-color:var(--cf);}
.ch{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--gb);}
.ct{font-size:17px;font-weight:300;color:var(--c);}
.ci{font-size:16px;opacity:.4;}
.cm2{display:flex;justify-content:space-between;margin-bottom:12px;}
.ctag{font-size:7px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:2px 7px;border:1px solid var(--gb);color:var(--cf);border-radius:1px;}
.cc{font-size:9px;font-weight:600;letter-spacing:2px;color:var(--cf);text-transform:uppercase;}
.bl{display:flex;flex-wrap:wrap;gap:4px;}
.bp{font-size:9px;color:var(--cd);padding:4px 8px;border:1px solid var(--gb);background:var(--g);border-radius:1px;cursor:pointer;transition:all .15s;white-space:nowrap;position:relative;}
.bp:hover{color:var(--g);background:var(--c);border-color:var(--c);}
.sd{position:absolute;top:-3px;right:-3px;width:6px;height:6px;border-radius:50%;border:1px solid var(--gm);}
.dCold{background:#4a7fa5;}.dWarm{background:#c9914a;}.dMeeting-Booked{background:#7a9e7e;}.dProposal-Sent{background:#9e7a9e;}.dWon{background:#5a9e6e;}.dNot-Interested{background:#8a4a4a;}
.nr{grid-column:1/-1;padding:60px;text-align:center;color:var(--gb);font-size:22px;font-style:italic;}

/* SHOWS */
#sv{padding:28px 48px;}
.mg{margin-bottom:20px;}
.ml{font-size:9px;font-weight:700;letter-spacing:4px;text-transform:uppercase;color:var(--cf);padding:8px 0 7px;border-bottom:1px solid var(--gb);margin-bottom:7px;}
.sc{background:var(--gm);border:1px solid var(--gb);padding:18px 22px;cursor:default;margin-bottom:2px;transition:border-color .2s;}
.sc:hover{border-color:var(--cf);}
.sct{display:grid;grid-template-columns:120px 1fr auto;gap:14px;align-items:start;cursor:pointer;}
.sda{font-size:15px;font-weight:200;color:var(--c);}
.syr{font-size:9px;letter-spacing:2px;color:var(--cf);text-transform:uppercase;margin-top:3px;}
.sn2{font-size:15px;font-weight:400;color:var(--c);margin-bottom:3px;}
.sl2{font-size:9px;color:var(--cf);margin-bottom:6px;}
.stags{display:flex;gap:4px;flex-wrap:wrap;}
.stag{font-size:7px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:2px 7px;border:1px solid var(--gb);color:var(--cf);border-radius:1px;}
.tEnt{border-color:#8a5a7a;color:#c48ab0;}.tFas{border-color:#7a6a9e;color:#a898cc;}.tWat{border-color:#9e8a4a;color:#ccb870;}.tArt{border-color:#5a8a7e;color:#8ab8b0;}.tSpo{border-color:#4a6a9e;color:#7898cc;}.tCre{border-color:#8a5a4a;color:#c08870;}.tTra{border-color:#4a8a5a;color:#78b888;}.tGul{border-color:#8a7a4a;color:#c0b070;}.tDes{border-color:#4a7a8a;color:#78a8b8;}
.treg{border-color:#2a5a3a;color:#5a9e6e;}.tpas{border-color:#5a4020;color:#c9914a;}
.schev{font-size:10px;color:var(--cf);margin-top:2px;transition:transform .2s;}
.sc.op .schev{transform:rotate(180deg);}
.sbod{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--gb);}
.sc.op .sbod{display:block;}
.sdesc{font-size:11px;font-weight:300;color:var(--cm);line-height:1.6;margin-bottom:14px;max-width:660px;}
.ssec{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--gm);}
.ssec:last-child{border-bottom:none;margin-bottom:4px;}
.ssl{font-size:8px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:3px;}
.lreg{color:#5a9e6e;}.lpas{color:#c9914a;}.lall{color:var(--cf);}
.ssnote{font-size:9px;color:var(--cf);font-style:italic;margin-bottom:7px;}
.spl{display:flex;flex-wrap:wrap;gap:4px;}
.sp{font-size:9px;color:var(--cd);padding:3px 8px;border:1px solid var(--gb);background:var(--g);border-radius:1px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.sp:hover{color:var(--g);background:var(--c);border-color:var(--c);}
.sp.preg{border-color:#2a5a3a;color:#7acd8a;background:rgba(90,158,110,.08);}
.sp.preg:hover{background:#5a9e6e;color:var(--g);border-color:#5a9e6e;}
.sp.ppas{border-color:#5a4020;color:#c9914a;background:rgba(201,145,74,.08);}
.sp.ppas:hover{background:#c9914a;color:var(--g);border-color:#c9914a;}
.slink{display:inline-block;margin-top:8px;font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--cf);text-decoration:none;border-bottom:1px solid var(--gb);padding-bottom:1px;transition:all .15s;}
.slink:hover{color:var(--c);border-color:var(--cf);}

/* BUDGET CYCLES */
#bcv{padding:28px 48px;}
.bc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:2px;}
.bc-card{background:var(--gm);border:1px solid var(--gb);padding:24px;cursor:pointer;transition:border-color .2s;}
.bc-card:hover,.bc-card.op{border-color:var(--cf);}
.bc-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;}
.bc-sector{font-size:17px;font-weight:300;color:var(--c);}
.bc-icon{font-size:20px;opacity:.5;}
.bc-timeline{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:14px;}
.bc-phase{background:var(--g);border:1px solid var(--gb);padding:10px 10px 8px;border-radius:1px;}
.bc-phase-label{font-size:7px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--cf);margin-bottom:4px;}
.bc-phase-val{font-size:12px;font-weight:400;color:var(--c);}
.bc-phase.plan{border-color:#4a5a7a;}.bc-phase.approve{border-color:#7a5a2a;}.bc-phase.spend{border-color:#2a5a4a;}
.bc-lead{font-size:9px;color:var(--cf);margin-bottom:12px;font-style:italic;}
.bc-body{display:none;margin-top:14px;padding-top:14px;border-top:1px solid var(--gb);}
.bc-card.op .bc-body{display:block;}
.bc-section{margin-bottom:14px;}
.bc-label{font-size:8px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--cf);margin-bottom:6px;}
.bc-note{font-size:11px;font-weight:300;color:var(--cm);line-height:1.6;margin-bottom:10px;}
.bc-list{list-style:none;display:flex;flex-direction:column;gap:4px;}
.bc-list li{font-size:10px;color:var(--cd);padding:4px 8px;border-left:2px solid var(--gb);}
.bc-list li.peak{border-color:#c9914a;color:var(--c);}
.bc-list li.signal{border-color:#5a9e6e;}
.bc-list li.dm{border-color:#9e7a9e;}
.bc-tip{background:var(--g);border:1px solid var(--gb);padding:12px 14px;border-radius:1px;font-size:10px;font-weight:300;color:var(--cm);line-height:1.6;margin-top:10px;}
.bc-chev{font-size:10px;color:var(--cf);transition:transform .2s;}
.bc-card.op .bc-chev{transform:rotate(180deg);}

/* OUTREACH CALENDAR */
#ocv{padding:28px 48px;}
.oc-month-sel{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:20px;}
.oc-mbtn{background:transparent;border:1px solid var(--gb);color:var(--cf);padding:7px 14px;font-family:"Source Sans 3",sans-serif;font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;border-radius:1px;transition:all .2s;}
.oc-mbtn:hover{border-color:var(--c);color:var(--c);}
.oc-mbtn.on{border-color:var(--c);background:var(--c);color:var(--g);font-weight:700;}
.oc-content{display:grid;grid-template-columns:1fr 1fr;gap:2px;}
.oc-panel{background:var(--gm);border:1px solid var(--gb);padding:22px;}
.oc-panel.full{grid-column:1/-1;}
.oc-panel-title{font-size:8px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid var(--gb);}
.oc-urgent .oc-panel-title{color:#c9914a;}
.oc-plan .oc-panel-title{color:#4a7fa5;}
.oc-now .oc-panel-title{color:#5a9e6e;}
.oc-alert .oc-panel-title{color:var(--cf);}
.oc-item{font-size:10px;color:var(--cd);padding:5px 9px;border-left:2px solid var(--gb);margin-bottom:5px;line-height:1.5;}
.oc-item.hot{border-color:#c9914a;color:var(--c);}
.oc-item.plan{border-color:#4a7fa5;}
.oc-item.now{border-color:#5a9e6e;color:var(--c);}
.oc-sectors{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:12px;}
.oc-sector{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:3px 9px;border:1px solid var(--gb);color:var(--cf);border-radius:1px;}
.oc-sector.hot{border-color:#c9914a;color:#c9914a;}
.oc-tip-box{background:var(--g);border:1px solid var(--gb);border-left:3px solid var(--c);padding:12px 14px;font-size:11px;font-weight:300;color:var(--cm);line-height:1.6;border-radius:1px;}
.oc-tip-label{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--c);margin-bottom:5px;}
.oc-budget-box{background:var(--g);border:1px solid var(--gb);border-left:3px solid #c9914a;padding:12px 14px;border-radius:1px;}
.oc-budget-label{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#c9914a;margin-bottom:5px;}
.oc-budget-text{font-size:11px;font-weight:300;color:var(--cm);line-height:1.6;}

/* DRAWER */
.ov{position:fixed;inset:0;background:rgba(8,20,18,.75);z-index:500;opacity:0;pointer-events:none;transition:opacity .25s;backdrop-filter:blur(3px);}
.ov.on{opacity:1;pointer-events:all;}
.dr{position:fixed;top:0;right:0;width:min(520px,100vw);height:100vh;background:#0a1714;border-left:1px solid var(--gb);z-index:600;transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;overflow:hidden;}
.dr.on{transform:translateX(0);}
.drh{padding:22px 24px 16px;border-bottom:1px solid var(--gb);display:flex;justify-content:space-between;align-items:flex-start;flex-shrink:0;}
.drb2{font-size:19px;font-weight:300;color:var(--c);}
.drc{font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--cf);margin-top:4px;}
.drl{font-size:9px;color:var(--cf);margin-top:5px;}
.drx{background:none;border:1px solid var(--gb);color:var(--cf);width:28px;height:28px;font-size:13px;cursor:pointer;display:flex;align-items:center;justify-content:center;border-radius:1px;transition:all .15s;flex-shrink:0;}
.drx:hover{border-color:var(--c);color:var(--c);}
.drbod{flex:1;overflow-y:auto;padding:18px 24px;display:flex;flex-direction:column;gap:18px;}
.drbod::-webkit-scrollbar{width:3px;}
.drbod::-webkit-scrollbar-thumb{background:var(--gb);}
.sl3{font-size:8px;font-weight:700;letter-spacing:3px;text-transform:uppercase;color:var(--cf);margin-bottom:7px;}
.sr{display:flex;gap:4px;flex-wrap:wrap;}
.stb{font-family:"Source Sans 3",sans-serif;font-size:8px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:5px 10px;border-radius:1px;cursor:pointer;border:1px solid var(--gb);background:transparent;color:var(--cf);transition:all .15s;}
.stb.on{color:var(--g)!important;}
.stb[data-s="Cold"].on{background:#4a7fa5;border-color:#4a7fa5;}
.stb[data-s="Warm"].on{background:#c9914a;border-color:#c9914a;}
.stb[data-s="Meeting Booked"].on{background:#7a9e7e;border-color:#7a9e7e;}
.stb[data-s="Proposal Sent"].on{background:#9e7a9e;border-color:#9e7a9e;}
.stb[data-s="Won"].on{background:#5a9e6e;border-color:#5a9e6e;}
.stb[data-s="Not Interested"].on{background:#8a4a4a;border-color:#8a4a4a;}
.inp{width:100%;background:var(--gm);border:1px solid var(--gb);color:var(--c);font-family:"Source Sans 3",sans-serif;font-size:11px;font-weight:300;padding:7px 10px;border-radius:1px;outline:none;transition:border-color .2s;}
.inp:focus{border-color:var(--cf);}
.inp::placeholder{color:var(--cf);}
textarea.inp{resize:vertical;min-height:75px;line-height:1.6;}
.tc{display:grid;grid-template-columns:1fr 130px;gap:7px;}
.cl{display:flex;flex-direction:column;gap:8px;}
.cc2{background:var(--gm);border:1px solid var(--gb);padding:11px 13px;border-radius:1px;position:relative;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:6px;}
.fw{margin-bottom:6px;}
.cdel{position:absolute;top:7px;right:7px;background:none;border:none;color:var(--cf);cursor:pointer;font-size:12px;padding:2px 4px;transition:color .15s;}
.cdel:hover{color:#c06060;}
.addb{display:flex;align-items:center;gap:7px;background:transparent;border:1px dashed var(--gb);color:var(--cf);font-family:"Source Sans 3",sans-serif;font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;padding:8px 12px;cursor:pointer;border-radius:1px;width:100%;transition:all .15s;margin-top:3px;}
.addb:hover{border-color:var(--cf);color:var(--c);}
.svb{background:var(--c);border:none;color:var(--g);font-family:"Source Sans 3",sans-serif;font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;padding:11px;cursor:pointer;border-radius:1px;width:100%;transition:opacity .15s;}
.svb:hover{opacity:.85;}
.sf{font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#5a9e6e;text-align:center;height:13px;margin-top:5px;}

/* FOOTER */
footer{padding:20px 48px;border-top:1px solid var(--gb);display:flex;justify-content:space-between;align-items:center;background:#0a1714;}
.fl{font-size:9px;font-weight:700;letter-spacing:6px;text-transform:uppercase;color:var(--gb);}
.fn{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--gb);}
</style>
</head>

// ── CRM ──────────────────────────────────────────────────────────
function crmKey(b){return'crm_'+b.toLowerCase().replace(/\s+/g,'_').replace(/[^a-z0-9_]/g,'');}
function getCRM(b){try{return JSON.parse(localStorage.getItem(crmKey(b)))||{};}catch(e){return{};}}
function setCRM(b,d){try{localStorage.setItem(crmKey(b),JSON.stringify(d));}catch(e){}}

function refreshStats(){
  const counts={Cold:0,Warm:0,'Meeting Booked':0,'Proposal Sent':0,Won:0,'Not Interested':0};
  let any=false;
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith('crm_')){const d=JSON.parse(localStorage.getItem(k)||'{}');if(d.status&&counts[d.status]!==undefined){counts[d.status]++;any=true;}}}}catch(e){}
  document.getElementById('crmStats').style.display=any?'flex':'none';
  Object.keys(counts).forEach(s=>{const el=document.getElementById('cs-'+s.replace(/ /g,'-'));if(el)el.textContent=counts[s]+' '+s;});
}

// ── DRAWER ───────────────────────────────────────────────────────
let curB='',curC='';
function openDr(b,c){
  curB=b;curC=c;
  const d=getCRM(b);
  document.getElementById('dBrand').textContent=b;
  document.getElementById('dCat').textContent=c;
  document.getElementById('dLast').textContent=d.lastContact?'Last contact: '+d.lastContact:'No contact logged yet';
  document.querySelectorAll('.stb').forEach(x=>x.classList.toggle('on',x.dataset.s===d.status));
  document.getElementById('dNotes').value=d.notes||'';
  document.getElementById('dAction').value=d.nextAction||'';
  document.getElementById('dDate').value=d.nextDate||'';
  renderContacts(d.contacts||[]);
  document.getElementById('saveFlash').textContent='';
  document.getElementById('dr').classList.add('on');
  document.getElementById('ov').classList.add('on');
  document.body.style.overflow='hidden';
}
function closeDr(){
  document.getElementById('dr').classList.remove('on');
  document.getElementById('ov').classList.remove('on');
  document.body.style.overflow='';
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDr();});
document.querySelectorAll('.stb').forEach(b=>{b.addEventListener('click',function(){document.querySelectorAll('.stb').forEach(x=>x.classList.remove('on'));this.classList.add('on');});});

function renderContacts(contacts){
  const list=document.getElementById('contactsList');
  list.innerHTML='';
  contacts.forEach((c,i)=>{
    const div=document.createElement('div');
    div.className='cc2';
    div.innerHTML=`<button class="cdel" onclick="delContact(${i})">✕</button>
      <div class="g2">
        <input class="inp" placeholder="Name" value="${(c.name||'').replace(/"/g,'&quot;')}" data-i="${i}" data-f="name">
        <input class="inp" placeholder="Job title" value="${(c.title||'').replace(/"/g,'&quot;')}" data-i="${i}" data-f="title">
      </div>
      <div class="g2">
        <input class="inp" placeholder="Email" value="${(c.email||'').replace(/"/g,'&quot;')}" data-i="${i}" data-f="email">
        <input class="inp" placeholder="Phone" value="${(c.phone||'').replace(/"/g,'&quot;')}" data-i="${i}" data-f="phone">
      </div>
      <div class="fw"><input class="inp" placeholder="LinkedIn" value="${(c.linkedin||'').replace(/"/g,'&quot;')}" data-i="${i}" data-f="linkedin"></div>
      <div class="fw"><input class="inp" placeholder="Notes on this person" value="${(c.notes||'').replace(/"/g,'&quot;')}" data-i="${i}" data-f="notes"></div>`;
    list.appendChild(div);
  });
}
function addContact(){
  const d=getCRM(curB);const c=d.contacts||[];c.push({name:'',title:'',email:'',phone:'',linkedin:'',notes:''});
  d.contacts=c;setCRM(curB,d);renderContacts(c);
  setTimeout(()=>{const b=document.querySelector('.drbod');b.scrollTop=b.scrollHeight;},50);
}
function delContact(i){const d=getCRM(curB);const c=d.contacts||[];c.splice(i,1);d.contacts=c;setCRM(curB,d);renderContacts(c);}
function saveDr(){
  const d=getCRM(curB)||{};
  const a=document.querySelector('.stb.on');
  d.status=a?a.dataset.s:(d.status||'');
  d.notes=document.getElementById('dNotes').value;
  d.nextAction=document.getElementById('dAction').value;
  d.nextDate=document.getElementById('dDate').value;
  d.lastContact=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
  const inputs=document.querySelectorAll('#contactsList [data-i]');
  const contacts=d.contacts||[];
  inputs.forEach(inp=>{const i=parseInt(inp.dataset.i);if(!contacts[i])contacts[i]={};contacts[i][inp.dataset.f]=inp.value;});
  d.contacts=contacts;
  setCRM(curB,d);
  updatePill(curB,d.status);
  refreshStats();
  document.getElementById('dLast').textContent='Last contact: '+d.lastContact;
  const f=document.getElementById('saveFlash');f.textContent='✓ Saved';setTimeout(()=>f.textContent='',2000);
}
function updatePill(b,s){
  document.querySelectorAll('.bp').forEach(el=>{
    if(el.dataset.b===b){let dot=el.querySelector('.sd');
      if(s){if(!dot){dot=document.createElement('span');dot.className='sd';el.appendChild(dot);}dot.className='sd d'+s.replace(/ /g,'-');dot.title=s;}
      else{if(dot)dot.remove();}
    }
  });
}

// ── BRAND GRID ───────────────────────────────────────────────────
const total=categories.reduce((s,c)=>s+c.brands.length,0);
document.getElementById('statNum').textContent=total.toLocaleString()+'+';
let activeF='all';

function renderBrands(){
  const q=document.getElementById('searchBox').value.trim().toLowerCase();
  const grid=document.getElementById('bv');
  grid.innerHTML='';
  let visC=0,visB=0;
  categories.forEach(cat=>{
    if(activeF!=='all'&&!cat.tags.includes(activeF))return;
    const bList=q?cat.brands.filter(b=>b.toLowerCase().includes(q)):cat.brands;
    if(!bList.length)return;
    visC++;visB+=bList.length;
    const block=document.createElement('div');
    block.className='cb';
    const pills=bList.map((b,bi)=>{
      const d=getCRM(b);
      const dot=d.status?'<span class="sd d'+d.status.replace(/ /g,'-')+'" title="'+d.status+'"></span>':'';
      const safe=b.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
      return '<span class="bp" data-b="'+safe+'" data-c="'+cat.title.replace(/"/g,'&quot;')+'" onclick="openDr(this.dataset.b,this.dataset.c)">'+b+dot+'</span>';
    }).join('');
    block.innerHTML=`<div class="ch"><div class="ct">${cat.title}</div><div class="ci">${cat.icon}</div></div>
      <div class="cm2"><span class="ctag">${cat.tags.join(' · ')}</span><span class="cc">${bList.length} brands</span></div>
      <div class="bl">${pills}</div>`;
    grid.appendChild(block);
  });
  document.getElementById('infoBar').textContent=visC?`Showing ${visB.toLocaleString()} brands across ${visC} categories — click any brand to log contact`:'No brands found';
}

document.querySelectorAll('[data-f]').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('[data-f]').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');activeF=btn.dataset.f;renderBrands();
  });
});

let activeSF='all';
function renderShows(){
  const q=document.getElementById('searchBox').value.trim().toLowerCase();
  const view=document.getElementById('sv');view.innerHTML='';
  let list=shows.filter(s=>{
    const mf=activeSF==='all'||s.sector===activeSF;
    const mq=!q||s.name.toLowerCase().includes(q)||s.location.toLowerCase().includes(q)||
      (s.brands||[]).some(b=>b.toLowerCase().includes(q))||
      (s.pastSponsors||[]).some(b=>b.toLowerCase().includes(q))||
      (s.registered||[]).some(b=>b.toLowerCase().includes(q));
    return mf&&mq;
  });
  document.getElementById('infoBar').textContent=list.length?`${list.length} show${list.length!==1?'s':''} — click to expand`:'No shows found';
  if(!list.length){view.innerHTML='<div class="nr">No shows found</div>';return;}
  const months={};list.forEach(s=>{if(!months[s.month])months[s.month]=[];months[s.month].push(s);});
  Object.keys(months).forEach(month=>{
    const mg=document.createElement('div');mg.className='mg';
    mg.innerHTML=`<div class="ml">${month}</div>`;
    months[month].forEach(show=>{
      const reg=show.registered||[];const past=show.pastSponsors||[];const all=show.brands||[];
      const card=document.createElement('div');card.className='sc';
      const tc={'Entertainment':'tEnt','Fashion':'tFas','Watches':'tWat','Art':'tArt','Sport':'tSpo','Creative':'tCre','Travel':'tTra','Gulf':'tGul','Design':'tDes'}[show.sector]||'';
      const xt=(reg.length?'<span class="stag treg">✅ Confirmed</span>':'')+(past.length?'<span class="stag tpas">🔄 Past Sponsors</span>':'');
      const mkPills=(arr,cls)=>arr.map(b=>{
        const safe=b.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
        const sn=show.name.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
        return '<span class="sp '+cls+'" data-b="'+safe+'" data-sn="'+sn+'" onclick="goTo(this.dataset.b,this.dataset.sn);event.stopPropagation()">'+b+'</span>';
      }).join('')
      card.innerHTML=`<div class="sct">
        <div><div class="sda">${show.dates}</div><div class="syr">${show.year}</div></div>
        <div><div class="sn2">${show.name}</div><div class="sl2">📍 ${show.location}</div>
          <div class="stags"><span class="stag ${tc}">${show.sector}</span>${xt}</div></div>
        <div class="schev">▼</div></div>
      <div class="sbod">
        <div class="sdesc">${show.desc}</div>
        ${reg.length?`<div class="ssec"><div class="ssl lreg">✅ Already Registered / Confirmed</div><div class="ssnote">Confirmed attending — approach for activation partnership</div><div class="spl">${mkPills(reg,'preg')}</div></div>`:''}
        ${past.length?`<div class="ssec"><div class="ssl lpas">🔄 Past Sponsors — Likely to Return</div><div class="ssnote">Sponsored previously — warm leads for outreach</div><div class="spl">${mkPills(past,'ppas')}</div></div>`:''}
        <div class="ssec"><div class="ssl lall">🎯 All Brands to Approach (${all.length})</div><div class="ssnote">Click any brand to open CRM</div><div class="spl">${mkPills(all,'')}</div></div>
        <a class="slink" href="https://www.${show.website}" target="_blank" onclick="event.stopPropagation()">↗ ${show.website}</a>
      </div>`;
      card.querySelector('.sct').addEventListener('click',()=>card.classList.toggle('op'));
      mg.appendChild(card);
    });
    view.appendChild(mg);
  });
}
document.querySelectorAll('[data-sf]').forEach(btn=>{
  btn.addEventListener('click',()=>{document.querySelectorAll('[data-sf]').forEach(b=>b.classList.remove('on'));btn.classList.add('on');activeSF=btn.dataset.sf;renderShows();});
});

function goTo(brand,showName){
  switchTab('brands');
  document.getElementById('searchBox').value=brand;
  activeF='all';
  document.querySelectorAll('[data-f]').forEach(b=>b.classList.remove('on'));
  document.querySelector('[data-f="all"]').classList.add('on');
  renderBrands();refreshStats();
  let cat='';categories.forEach(c=>{if(c.brands.includes(brand))cat=c.title;});
  setTimeout(()=>openDr(brand,cat||showName),150);
}

// ── OUTREACH PLANNER ─────────────────────────────────────────────
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
let activeMonth=MONTHS[new Date().getMonth()];

function renderOutreach(){
  const view=document.getElementById('ocv');
  view.innerHTML='';
  document.getElementById('infoBar').textContent='Your month-by-month outreach intelligence — what to do right now and what to plan ahead';
  
  // Month selector
  const sel=document.createElement('div');sel.className='oc-month-sel';
  MONTHS.forEach(m=>{
    const btn=document.createElement('button');btn.className='oc-mbtn'+(m===activeMonth?' on':'');
    btn.textContent=m;
    btn.addEventListener('click',()=>{activeMonth=m;renderOutreach();});
    sel.appendChild(btn);
  });
  view.appendChild(sel);

  const data=outreachCalendar[activeMonth];
  if(!data){view.innerHTML+='<div class="nr">No data for this month yet</div>';return;}

  const grid=document.createElement('div');grid.className='oc-content';

  // Shows happening
  const showsPanel=document.createElement('div');showsPanel.className='oc-panel oc-urgent';
  showsPanel.innerHTML=`<div class="oc-panel-title">🔥 Shows Happening This Month</div>
    ${data.urgentShows.map(s=>`<div class="oc-item hot">${s}</div>`).join('')}`;
  grid.appendChild(showsPanel);

  // Hot sectors
  const sectPanel=document.createElement('div');sectPanel.className='oc-panel oc-now';
  sectPanel.innerHTML=`<div class="oc-panel-title">📡 Hot Sectors Right Now</div>
    <div class="oc-sectors">${data.hotSectors.map(s=>`<span class="oc-sector hot">${s}</span>`).join('')}</div>
    <div class="oc-panel-title" style="margin-top:14px">✅ Approach NOW</div>
    ${data.approachNow.map(a=>`<div class="oc-item now">${a}</div>`).join('')}`;
  grid.appendChild(sectPanel);

  // Plan ahead
  const planPanel=document.createElement('div');planPanel.className='oc-panel oc-plan';
  planPanel.innerHTML=`<div class="oc-panel-title">📅 Plan Ahead — Start These Conversations</div>
    ${data.planAhead.map(p=>`<div class="oc-item plan">${p}</div>`).join('')}`;
  grid.appendChild(planPanel);

  // Budget alert
  const alertPanel=document.createElement('div');alertPanel.className='oc-panel oc-alert';
  alertPanel.innerHTML=`<div class="oc-panel-title">💰 Budget Intelligence</div>
    <div class="oc-budget-box"><div class="oc-budget-label">Where the Money Is</div><div class="oc-budget-text">${data.budgetAlert}</div></div>`;
  grid.appendChild(alertPanel);

  // Tip - full width
  const tipPanel=document.createElement('div');tipPanel.className='oc-panel full';
  tipPanel.innerHTML=`<div class="oc-tip-box"><div class="oc-tip-label">💡 Scott's Tip for ${activeMonth}</div>${data.tip}</div>`;
  grid.appendChild(tipPanel);

  view.appendChild(grid);
}

// ── TAB SWITCHING ─────────────────────────────────────────────────
function switchTab(tab){
  document.querySelectorAll('.tb').forEach(b=>b.classList.remove('on'));
  document.querySelector('[data-tab="'+tab+'"]').classList.add('on');
  document.getElementById('bv').style.display='none';
  document.getElementById('sv').style.display='none';
  document.getElementById('bcv').style.display='none';
  document.getElementById('ocv').style.display='none';
  document.getElementById('acv').style.display='none';
  document.getElementById('bfil').style.display='none';
  document.getElementById('sfil').style.display='none';
  document.getElementById('crmStats').style.display='none';
  document.getElementById('searchBox').placeholder='Search...';
  if(tab==='brands'){
    document.getElementById('bv').style.display='';
    document.getElementById('bfil').style.display='flex';
    document.getElementById('searchBox').placeholder='Search brands...';
    refreshStats();renderBrands();
  } else if(tab==='shows'){
    document.getElementById('sv').style.display='block';
    document.getElementById('sfil').style.display='flex';
    document.getElementById('searchBox').placeholder='Search shows...';
    renderShows();
  } else if(tab==='budget'){
    document.getElementById('bcv').style.display='block';
    document.getElementById('searchBox').placeholder='Search sectors...';
    renderBudget();
  } else if(tab==='outreach'){
    document.getElementById('ocv').style.display='block';
    document.getElementById('searchBox').placeholder='';
    renderOutreach();
  } else if(tab==='activations'){
    document.getElementById('acv').style.display='block';
    document.getElementById('searchBox').placeholder='Search activations...';
    renderActivations();
  }
}

document.querySelectorAll('.tb').forEach(btn=>{
  btn.addEventListener('click',()=>switchTab(btn.dataset.tab));
});

document.getElementById('searchBox').addEventListener('input',()=>{
  const tab=document.querySelector('.tb.on')?.dataset.tab;
  if(tab==='brands')renderBrands();
  else if(tab==='shows')renderShows();
});

// ── INIT ─────────────────────────────────────────────────────────
refreshStats();
renderBrands();


// ── ACTIVATIONS ──────────────────────────────────────────────
let acFilter = 'all';

function renderActivations(){
  const q = document.getElementById('searchBox').value.trim().toLowerCase();
  const view = document.getElementById('acv');
  view.innerHTML = '';
  document.getElementById('infoBar').textContent = 'Previous show-stopping brand activations — click any brand to expand their work';

  let filtered = brandActivations.filter(b => {
    const mq = !q || b.brand.toLowerCase().includes(q) ||
      b.category.toLowerCase().includes(q) ||
      b.activations.some(a => a.title.toLowerCase().includes(q) || a.description.toLowerCase().includes(q) || a.event.toLowerCase().includes(q));
    return mq;
  });

  if(!filtered.length){view.innerHTML='<div class="nr">No activations found</div>';return;}

  // Filter row
  const types = [...new Set(brandActivations.flatMap(b=>b.activations.map(a=>a.type)))].sort();
  const filterRow = document.createElement('div');
  filterRow.className = 'ac-filter-row';
  const allBtn = document.createElement('button');
  allBtn.className = 'fb' + (acFilter==='all'?' on':'');
  allBtn.textContent = 'All Types';
  allBtn.onclick = ()=>{ acFilter='all'; renderActivations(); };
  filterRow.appendChild(allBtn);
  ['Runway Show','Cruise Show','Destination Show','Festival Activation','Brand Experience','Sport Sponsorship','Cultural Programme','Product Launch','Pop-Up'].forEach(t=>{
    const btn = document.createElement('button');
    btn.className = 'fb' + (acFilter===t?' on':'');
    btn.textContent = t;
    btn.onclick = ()=>{ acFilter=t; renderActivations(); };
    filterRow.appendChild(btn);
  });
  view.appendChild(filterRow);

  const grid = document.createElement('div');
  grid.className = 'ac-grid';

  filtered.forEach(b => {
    const actToShow = acFilter==='all' ? b.activations :
      b.activations.filter(a => a.type.toLowerCase().includes(acFilter.toLowerCase()));
    if(!actToShow.length) return;

    const card = document.createElement('div');
    card.className = 'ac-card';

    const itemsHTML = actToShow.map(a => `
      <div class="ac-item">
        <div class="ac-item-head">
          <div class="ac-item-title">${a.title}</div>
          <div class="ac-item-meta">
            <span class="ac-year">${a.year}</span>
            <span class="ac-type">${a.type}</span>
          </div>
        </div>
        <div class="ac-event">📍 ${a.event}</div>
        <div class="ac-desc">${a.description}</div>
        <a class="ac-link" href="${a.link}" target="_blank">↗ View Reference</a>
      </div>
    `).join('');

    card.innerHTML = `
      <div class="ac-card-top">
        <div>
          <div class="ac-brand">${b.brand}</div>
          <div class="ac-cat">${b.category}</div>
        </div>
        <div class="ac-chevron">▼</div>
      </div>
      <div class="ac-count">${actToShow.length} activation${actToShow.length!==1?'s':''} on record</div>
      <div class="ac-overview">${b.overview}</div>
      <a class="ac-website" href="https://www.${b.website}" target="_blank">↗ ${b.website}</a>
      <div class="ac-body">${itemsHTML}</div>
    `;

    card.querySelector('.ac-card-top').addEventListener('click', () => card.classList.toggle('op'));
    grid.appendChild(card);
  });

  view.appendChild(grid);
  if(!grid.children.length){
    grid.innerHTML = '<div class="nr">No activations match this filter</div>';
  }
}
